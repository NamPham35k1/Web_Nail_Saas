version: '3.8'

services:
  # PostgreSQL Database (Optional for containerized environments)
  postgres:
    image: postgres:16-alpine
    container_name: nailvibe-postgres
    restart: always
    environment:
      POSTGRES_USER: nailvibe
      POSTGRES_PASSWORD: nailvibepassword2026
      POSTGRES_DB: nailvibe_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nailvibe -d nailvibe_saas"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nailvibe-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://nailvibe:nailvibepassword2026@postgres:5432/nailvibe_saas?schema=public
      JWT_SECRET: nailvibe_production_secret_key_change_me_in_real_deploy
      JWT_EXPIRES_IN: 7d
      APP_URL: http://localhost:8080
      BACKEND_URL: http://localhost:5000
      UPLOAD_DIR: ./uploads
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend Web App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nailvibe-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
